      <stop offset="0%" stop-color="#0866F5"/>
      <stop offset="60%" stop-color="#0256D6"/>
      <stop offset="100%" stop-color="#003EAA"/>
    </linearGradient>
    <linearGradient id="heroGlow" x1="42" y1="0" x2="42" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.25"/>
